[workspace]
resolver = "3"
members = ["crates/core-contracts", "crates/core-identity", "crates/core-engines", "crates/core-process", "crates/core-runtime", "crates/core-cli"]

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.99.1"
license = "LicenseRef-Noncommercial-Network-ShareAlike-1.0"
repository = "https://github.com/KiaroSama/Numera-Core-Browser"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
sha2 = "=0.11.1"
url = "=2.5.8"
getrandom = "=0.4.3"
core-contracts = { path = "crates/core-contracts" }
core-identity = { path = "crates/core-identity" }
core-engines = { path = "crates/core-engines" }
core-process = { path = "crates/core-process" }
core-runtime = { path = "crates/core-runtime" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
