name: Chromium cold source build
on:
  workflow_dispatch:
    inputs:
      target:
        description: Standard public hosted target
        type: choice
        options: [windows-2025-vs2026, ubuntu-24.04]
        default: windows-2025-vs2026
      budget_minutes:
        description: Bounded cold acquisition and compilation budget (10-330)
        type: number
        default: 330
      component_build:
        description: Use an explicitly labeled development component build
        type: boolean
        default: true
      debug_build:
        description: Use upstream debug compilation to reduce cold compiler optimization work
        type: boolean
        default: true
      prerequisites_only:
        description: Verify native build prerequisites without engine source
        type: boolean
        default: false
      parallelism:
        description: Local compiler ceiling (1-4), also bounded by runner CPU/memory
        type: number
        default: 4
permissions:
  contents: read
concurrency:
  group: chromium-cold-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  source:
    if: >-
      github.repository == 'KiaroSama/Numera-Core-Browser' && github.event.repository.private == false &&
      (inputs.target == 'windows-2025-vs2026' || inputs.target == 'ubuntu-24.04')
    runs-on: ${{ inputs.target }}
    timeout-minutes: 350
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and test native source orchestration
        run: |
          cargo test --locked -p core-tooling --bin numera-engine-build --bin numera-linux-preparation
          cargo build --locked -p core-tooling --bins
      - name: Prepare capacity on the disposable Linux runner
        if: inputs.target == 'ubuntu-24.04'
        run: target/debug/numera-linux-preparation
      - name: Run selected native source or prerequisite experiment
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_BUDGET_MINUTES: ${{ inputs.budget_minutes }}
          BUILD_COMPONENT: ${{ inputs.component_build }}
          BUILD_DEBUG: ${{ inputs.debug_build }}
          BUILD_PREREQUISITES_ONLY: ${{ inputs.prerequisites_only }}
          BUILD_PARALLELISM: ${{ inputs.parallelism }}
        run: |
          $Arguments = @('--output', 'build/engine-evidence', '--budget-minutes', $env:BUILD_BUDGET_MINUTES, '--parallelism', $env:BUILD_PARALLELISM)
          if ($env:BUILD_COMPONENT -eq 'true') { $Arguments += '--component-build' }
          if ($env:BUILD_DEBUG -eq 'true') { $Arguments += '--debug-build' }
          if ($env:BUILD_PREREQUISITES_ONLY -eq 'true') { $Arguments += '--prerequisites-only' }
          & ./target/debug/numera-engine-build @Arguments
          exit $LASTEXITCODE
      - name: Preserve evidence only; no unreviewed browser binary publication
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cold-source-evidence-${{ inputs.target }}
          path: build/engine-evidence
          retention-days: 7
          compression-level: 9
          if-no-files-found: error
