name: Chromium native build segment
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      segment:
        type: number
        required: true
      minutes:
        type: number
        required: true
      previous:
        type: number
        default: 0
      checkpoint_sha:
        type: string
        default: ''
      reviewed_checkpoint_run:
        type: string
        default: ''
      reviewed_checkpoint_segment:
        type: string
        default: '2'
      read_only_replay:
        type: boolean
        default: false
    outputs:
      result:
        description: Whether this segment built the source or saved a partial checkpoint
        value: ${{ jobs.native.outputs.result }}
      checkpoint_sha:
        description: SHA-256 exported by the producing native job
        value: ${{ jobs.native.outputs.checkpoint_sha }}
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  native:
    if: >-
      github.repository == 'KiaroSama/Numera-Core-Browser' && github.event.repository.private == false &&
      github.ref == 'refs/heads/main' && (inputs.target == 'ubuntu-24.04' || inputs.target == 'windows-2025-vs2026')
    runs-on: ${{ inputs.target }}
    timeout-minutes: 350
    outputs:
      result: ${{ steps.build.outputs.result }}
      checkpoint_sha: ${{ steps.build.outputs.checkpoint_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned telemetry dependency
        run: python -m pip install --disable-pip-version-check -r requirements-engine-build.txt
      - name: Install the Linux window inspection tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends x11-utils=7.7+6build2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Install locked automation test clients without browser downloads
        working-directory: tests/native-automation
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Validate build tooling and the loopback fixture transport
        if: inputs.segment == 1
        shell: bash
        run: |
          python -m unittest discover -s scripts/tests -v
          node --test tests/native-automation/loopback.test.mjs
      - name: Resolve the reviewed checkpoint from main
        if: inputs.reviewed_checkpoint_run != ''
        id: reviewed
        env:
          BUILD_SEGMENT: ${{ inputs.segment }}
          REVIEWED_CHECKPOINT_RUN: ${{ inputs.reviewed_checkpoint_run }}
          REVIEWED_CHECKPOINT_SEGMENT: ${{ inputs.reviewed_checkpoint_segment }}
        shell: pwsh
        run: |
          $Key = python scripts/chromium_staged_build.py --segment $env:BUILD_SEGMENT --checkpoint-key
          if ($LASTEXITCODE -ne 0 -or $Key -notmatch '^chromium-staged-\d+-\d+-[1-4]-(ubuntu-24\.04|windows-2025-vs2026)$') {
            throw 'Cannot resolve the reviewed checkpoint cache key'
          }
          "key=$Key" >> $env:GITHUB_OUTPUT
      - name: Restore the reviewed prior workflow checkpoint
        if: steps.reviewed.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/chromium-staged-cache/checkpoint.tar
          key: ${{ steps.reviewed.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore only the predecessor cache from this workflow attempt
        if: inputs.previous > 0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/chromium-staged-cache/checkpoint.tar
          key: chromium-staged-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.previous }}-${{ inputs.target }}
          fail-on-cache-miss: true
      - name: Compile or continue the full native graph
        id: build
        env:
          BUILD_SEGMENT: ${{ inputs.segment }}
          BUILD_MINUTES: ${{ inputs.minutes }}
          EXPECTED_CHECKPOINT_SHA: ${{ inputs.checkpoint_sha }}
          REVIEWED_CHECKPOINT_RUN: ${{ inputs.reviewed_checkpoint_run }}
          REVIEWED_CHECKPOINT_SEGMENT: ${{ inputs.reviewed_checkpoint_segment }}
          READ_ONLY_REPLAY: ${{ inputs.read_only_replay }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: python scripts/chromium_staged_build.py --segment $env:BUILD_SEGMENT --minutes $env:BUILD_MINUTES
      - name: Confirm repository cache allowance before saving a partial compile
        if: inputs.read_only_replay == false && steps.build.outputs.result == 'PARTIAL'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $Usage = gh api "repos/$env:GITHUB_REPOSITORY/actions/cache/usage" --jq '.active_caches_size_in_bytes'
          if ($LASTEXITCODE -ne 0 -or $Usage -notmatch '^\d+$') { throw 'Cannot verify repository cache allowance' }
          $Checkpoint = (Get-Item 'build/chromium-staged-cache/checkpoint.tar').Length
          if (([int64]$Usage + $Checkpoint + 150000000) -ge 9500000000) { throw 'Repository cache headroom is too small for this checkpoint' }
      - name: Save the bounded checkpoint for the next native job
        if: inputs.read_only_replay == false && steps.build.outputs.result == 'PARTIAL'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: build/chromium-staged-cache/checkpoint.tar
          key: chromium-staged-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.segment }}-${{ inputs.target }}
      - name: Retain source-build and renderer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staged-source-evidence-${{ inputs.segment }}-${{ inputs.target }}
          path: build/chromium-staged-evidence
          retention-days: 7
          if-no-files-found: warn
      - name: Require a linked build by the fourth segment
        if: inputs.segment == 4 && steps.build.outputs.result == 'PARTIAL'
        shell: pwsh
        run: throw 'The final segment saved a partial checkpoint. The owned Chromium build is incomplete.'
