name: Chromium staged source build
on:
  workflow_dispatch:
    inputs:
      target:
        description: Standard native public runner
        type: choice
        options: [ubuntu-24.04, windows-2025-vs2026]
        default: ubuntu-24.04
      reviewed_checkpoint_run:
        description: Optionally start from a prior verified checkpoint recorded on main
        type: string
        default: ''
      reviewed_checkpoint_segment:
        description: Segment of the prior run to restore when a run ID is provided
        type: choice
        options: ['1', '2', '3', '4']
        default: '2'
      reviewed_upstream_evidence:
        description: Optional evidence filename for a reviewed stable Chromium candidate
        type: string
        default: ''
      verified_source_export:
        description: Optional verified source export filename to retain a tested development runtime
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: chromium-staged-source
  cancel-in-progress: false
jobs:
  first:
    if: >-
      github.repository == 'KiaroSama/Numera-Core-Browser' && github.event.repository.private == false &&
      github.ref == 'refs/heads/main' && (inputs.target == 'ubuntu-24.04' || inputs.target == 'windows-2025-vs2026')
    uses: ./.github/workflows/chromium-staged-segment.yml
    with:
      target: ${{ inputs.target }}
      segment: 1
      minutes: 275
      reviewed_checkpoint_run: ${{ inputs.reviewed_checkpoint_run }}
      reviewed_checkpoint_segment: ${{ inputs.reviewed_checkpoint_segment }}
      reviewed_upstream_evidence: ${{ inputs.reviewed_upstream_evidence }}
      verified_source_export: ${{ inputs.verified_source_export }}
  second:
    needs: first
    if: needs.first.outputs.result == 'PARTIAL'
    uses: ./.github/workflows/chromium-staged-segment.yml
    with:
      target: ${{ inputs.target }}
      segment: 2
      minutes: 275
      previous: 1
      checkpoint_sha: ${{ needs.first.outputs.checkpoint_sha }}
      reviewed_upstream_evidence: ${{ inputs.reviewed_upstream_evidence }}
      verified_source_export: ${{ inputs.verified_source_export }}
  third:
    needs: second
    if: needs.second.outputs.result == 'PARTIAL'
    uses: ./.github/workflows/chromium-staged-segment.yml
    with:
      target: ${{ inputs.target }}
      segment: 3
      minutes: 275
      previous: 2
      checkpoint_sha: ${{ needs.second.outputs.checkpoint_sha }}
      reviewed_upstream_evidence: ${{ inputs.reviewed_upstream_evidence }}
      verified_source_export: ${{ inputs.verified_source_export }}
  fourth:
    needs: third
    if: needs.third.outputs.result == 'PARTIAL'
    uses: ./.github/workflows/chromium-staged-segment.yml
    with:
      target: ${{ inputs.target }}
      segment: 4
      minutes: 275
      previous: 3
      checkpoint_sha: ${{ needs.third.outputs.checkpoint_sha }}
      reviewed_upstream_evidence: ${{ inputs.reviewed_upstream_evidence }}
      verified_source_export: ${{ inputs.verified_source_export }}
  attest-development-runtime:
    if: >-
      always() && inputs.verified_source_export != '' &&
      (needs.first.outputs.result == 'PASS' && needs.first.result == 'success' ||
       needs.second.outputs.result == 'PASS' && needs.second.result == 'success' ||
       needs.third.outputs.result == 'PASS' && needs.third.result == 'success' ||
       needs.fourth.outputs.result == 'PASS' && needs.fourth.result == 'success')
    needs: [first, second, third, fourth]
    uses: ./.github/workflows/chromium-development-provenance.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    with:
      target: ${{ inputs.target }}
