name: Tiny Siso checkpoint research
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: siso-checkpoint-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  seed:
    if: github.repository == 'KiaroSama/Numera-Core-Browser' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      checkpoint_sha: ${{ steps.probe.outputs.checkpoint_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Cold compile one authored C object; no browser source or objects
        id: probe
        run: python3 scripts/siso-checkpoint-probe.py seed
      - name: Preserve bounded research checkpoint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tiny-siso-checkpoint
          path: build/siso-probe/checkpoint.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Preserve seed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tiny-siso-seed-evidence
          path: |
            build/siso-probe/report.json
            build/siso-probe/*.log
          retention-days: 7
          if-no-files-found: error
  resume:
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download checkpoint from this same run with required digest verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tiny-siso-checkpoint
          path: build/checkpoint-input
          digest-mismatch: error
      - name: Verify provenance, resume and exercise dependency invalidation
        env:
          EXPECTED_CHECKPOINT_SHA: ${{ needs.seed.outputs.checkpoint_sha }}
        run: python3 scripts/siso-checkpoint-probe.py resume --checkpoint build/checkpoint-input/checkpoint.tar.gz --expected-sha "$EXPECTED_CHECKPOINT_SHA"
      - name: Preserve research result only; no engine acceptance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tiny-siso-resume-evidence
          path: |
            build/siso-probe/report.json
            build/siso-probe/*.log
          retention-days: 7
          if-no-files-found: error
