name: Replay reviewed Chromium checkpoint for native validation
on:
  workflow_dispatch:
    inputs:
      target:
        description: Standard native runner matching the reviewed checkpoint
        type: choice
        options: [ubuntu-24.04, windows-2025-vs2026]
        default: ubuntu-24.04
      reviewed_checkpoint_run:
        description: Run ID of the verified native checkpoint recorded on main
        type: string
        required: true
      reviewed_checkpoint_segment:
        description: Segment of the verified native checkpoint recorded on main
        type: choice
        options: ['1', '2', '3', '4']
        default: '2'
      reviewed_upstream_evidence:
        description: Evidence filename for a candidate checkpoint with a different source lock
        type: string
        default: ''
      verified_source_export:
        description: Optional verified source export filename to retain a tested development runtime
        type: string
        default: ''
      windows_object_probe:
        description: Measure a bounded Windows object target batch on the reviewed cache
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: chromium-read-only-replay
  cancel-in-progress: false
jobs:
  first:
    if: >-
      github.repository == 'KiaroSama/Numera-Core-Browser' && github.event.repository.private == false &&
      github.ref == 'refs/heads/main' && (inputs.target == 'ubuntu-24.04' || inputs.target == 'windows-2025-vs2026')
    uses: ./.github/workflows/chromium-staged-segment.yml
    with:
      target: ${{ inputs.target }}
      segment: 1
      minutes: ${{ inputs.windows_object_probe && 45 || 275 }}
      reviewed_checkpoint_run: ${{ inputs.reviewed_checkpoint_run }}
      reviewed_checkpoint_segment: ${{ inputs.reviewed_checkpoint_segment }}
      reviewed_upstream_evidence: ${{ inputs.reviewed_upstream_evidence }}
      verified_source_export: ${{ inputs.verified_source_export }}
      read_only_replay: true
      windows_object_probe: ${{ inputs.windows_object_probe }}
  attest-development-runtime:
    if: inputs.verified_source_export != '' && needs.first.outputs.result == 'PASS'
    needs: first
    uses: ./.github/workflows/chromium-development-provenance.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    with:
      target: ${{ inputs.target }}
