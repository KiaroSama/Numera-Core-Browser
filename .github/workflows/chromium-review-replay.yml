name: Replay reviewed Chromium checkpoint for native validation
on:
  workflow_dispatch:
    inputs:
      target:
        description: Standard native runner matching the reviewed checkpoint
        type: choice
        options: [ubuntu-24.04, windows-2025-vs2026]
        default: ubuntu-24.04
      reviewed_checkpoint_run:
        description: Run ID of the verified native checkpoint recorded on main
        type: string
        required: true
      reviewed_checkpoint_segment:
        description: Segment of the verified native checkpoint recorded on main
        type: choice
        options: ['1', '2', '3', '4']
        default: '2'
permissions:
  contents: read
  actions: read
  checks: write
concurrency:
  group: chromium-read-only-replay
  cancel-in-progress: false
jobs:
  first:
    if: >-
      github.repository == 'KiaroSama/Numera-Core-Browser' && github.event.repository.private == false &&
      github.ref == 'refs/heads/main' && (inputs.target == 'ubuntu-24.04' || inputs.target == 'windows-2025-vs2026')
    uses: ./.github/workflows/chromium-staged-segment.yml
    with:
      target: ${{ inputs.target }}
      segment: 1
      minutes: 275
      reviewed_checkpoint_run: ${{ inputs.reviewed_checkpoint_run }}
      reviewed_checkpoint_segment: ${{ inputs.reviewed_checkpoint_segment }}
      read_only_replay: true
