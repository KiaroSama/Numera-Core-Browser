name: Verify and run the retained native Chromium package
on:
  workflow_dispatch:
    inputs:
      bundle_run:
        description: Completed repository workflow run that retained the development bundle
        type: string
        required: true
      host:
        description: Standard native image for the independent portability test
        type: choice
        options: [ubuntu-24.04, ubuntu-22.04, windows-2025-vs2026]
        default: ubuntu-24.04
permissions:
  actions: read
  contents: read
concurrency:
  group: retained-chromium-test-${{ inputs.host }}
  cancel-in-progress: false
jobs:
  fresh-host:
    if: >-
      github.repository == 'KiaroSama/Numera-Core-Browser' && github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      (inputs.host == 'ubuntu-24.04' || inputs.host == 'ubuntu-22.04' || inputs.host == 'windows-2025-vs2026')
    runs-on: ${{ inputs.host }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify the completed source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_RUN: ${{ inputs.bundle_run }}
          BUNDLE_HOST: ${{ inputs.host }}
        shell: bash
        run: |
          "${{ runner.os == 'Windows' && 'python' || 'python3' }}" - <<'PY'
          import json
          import os
          import re
          import subprocess

          run = os.environ['BUNDLE_RUN']
          target = 'windows-2025-vs2026' if os.environ['BUNDLE_HOST'] == 'windows-2025-vs2026' else 'ubuntu-24.04'
          repository = 'KiaroSama/Numera-Core-Browser'
          if not re.fullmatch(r'[1-9][0-9]{0,17}', run):
              raise SystemExit('Select a successful numeric repository build run')
          metadata = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/actions/runs/{run}'], timeout=30))
          revision = metadata['head_sha']
          if (metadata['workflow_id'] not in {426002445, 425565660} or metadata['id'] != int(run)
                  or metadata['status'] != 'completed' or metadata['conclusion'] != 'success'
                  or metadata['event'] != 'workflow_dispatch' or metadata['head_branch'] != 'main'
                  or metadata['head_repository']['full_name'] != repository
                  or not re.fullmatch(r'[0-9a-f]{40}', revision)):
              raise SystemExit('The selected build is outside the retained-package verification scope')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'run={run}\nsha={revision}\ntarget={target}\n')
          PY
      - name: Download the retained runtime from the completed workflow
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: development-chromium-runtime-${{ steps.source.outputs.target }}
          path: build/downloaded-chromium/package
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
      - name: Download the matching provenance bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: development-chromium-provenance-${{ steps.source.outputs.target }}
          path: build/downloaded-chromium/provenance
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
      - name: Select the pinned fixture Python on Ubuntu 22.04
        if: inputs.host == 'ubuntu-22.04'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.16'
      - name: Prepare the verifier and window inspection fixtures
        if: runner.os == 'Linux'
        env:
          X11_UTILS_VERSION: ${{ inputs.host == 'ubuntu-22.04' && '7.7+5build2' || '7.7+6build2' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends "x11-utils=$X11_UTILS_VERSION"
          command -v xvfb-run Xvfb xauth xwininfo xprop gh
          python3 -m pip install --disable-pip-version-check -r requirements-engine-build.txt
          cargo build --locked -p core-cli --release
      - name: Prepare the native Windows archive verifier
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-engine-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p core-cli --release
          exit $LASTEXITCODE
      - name: Verify provenance and run the package on this fresh native host
        env:
          NUMERA_BUNDLE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          NUMERA_BUNDLE_RUN: ${{ steps.source.outputs.run }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/chromium_download_smoke.py
      - name: Retain the independent download and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}-retained-browser-verification
          path: build/chromium-download-smoke
          retention-days: 7
          if-no-files-found: warn
