name: Bounded IPC fuzzing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.*', 'contracts/**', 'fuzz/**', 'scripts/seed-fuzz.py', 'scripts/licenses-fuzz.py', 'licenses/fuzz/**', '.github/workflows/fuzz.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'contracts/**', 'fuzz/**', 'scripts/seed-fuzz.py', 'scripts/licenses-fuzz.py', 'licenses/fuzz/**', '.github/workflows/fuzz.yml']
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact development-only fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-11-10 --profile minimal
          cargo +nightly-2026-11-10 install cargo-fuzz --version '=0.13.2' --locked
      - name: Seed public wire fixtures and verify fuzz dependency notices
        run: |
          python3 scripts/seed-fuzz.py
          python3 scripts/licenses-fuzz.py --check
          python3 scripts/security-audit.py --lock-file fuzz/Cargo.lock --output build/fuzz-security.json
      - name: Run sixty-second AddressSanitizer and coverage-guided campaign
        run: |
          mkdir -p build
          cargo +nightly-2026-11-10 fuzz run wire -- -max_total_time=60 -max_len=1048576 -rss_limit_mb=1024 -timeout=2 -seed=20261110 > build/fuzz-wire.log 2>&1
      - name: Retain development fuzz evidence and any reproducer
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ipc-fuzz-evidence
          path: |
            build/fuzz-wire.log
            build/fuzz-security.json
            fuzz/artifacts
          if-no-files-found: error
          retention-days: 1
