name: Rust and NCB-1 control plane
on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', 'contracts/**', 'scripts/**', 'licenses/**', '.github/workflows/rust.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Formatting and strict lints
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          exit $LASTEXITCODE
      - name: Validate PowerShell orchestration syntax
        shell: pwsh
        run: ./scripts/Check-PowerShell.ps1
      - name: Unit and actual CLI process tests
        run: cargo test --workspace --locked
      - name: Build CLI without a display or automation client dependency
        run: cargo build --locked -p core-cli
      - name: Native executable and canonical conformance
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $Binary = if ($IsWindows) { 'target/debug/numera-core.exe' } else { 'target/debug/numera-core' }
          & $Binary --json doctor
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/export-contracts.py --binary $Binary --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check-contracts.py --binary $Binary
          exit $LASTEXITCODE
      - name: License inventory and complete dependency notices
        run: python scripts/licenses.py --check
  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Query current vulnerability database for every locked package
        run: python3 scripts/security-audit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-security
          path: build/security-audit.json
          if-no-files-found: error
