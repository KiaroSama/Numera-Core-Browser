name: Rust and NCB-1 control plane
on:
  push:
    branches: [main, 'implementation/**']
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', 'contracts/**', 'scripts/Build.ps1', 'scripts/Check-PowerShell.ps1', 'scripts/export-contracts.py', 'scripts/check-contracts.py', 'scripts/package-contracts.py', 'scripts/licenses.py', 'scripts/security-audit.py', 'scripts/logging_util.py', 'scripts/package-cli.py', 'scripts/verify-cli-package.py', 'scripts/ncb1_client.py', 'scripts/tests/test_ncb1_client.py', 'licenses/**', 'requirements-dev.txt', '.github/workflows/rust.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', 'contracts/**', 'scripts/Build.ps1', 'scripts/Check-PowerShell.ps1', 'scripts/export-contracts.py', 'scripts/check-contracts.py', 'scripts/package-contracts.py', 'scripts/licenses.py', 'scripts/security-audit.py', 'scripts/logging_util.py', 'scripts/package-cli.py', 'scripts/verify-cli-package.py', 'scripts/ncb1_client.py', 'scripts/tests/test_ncb1_client.py', 'licenses/**', 'requirements-dev.txt', '.github/workflows/rust.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Formatting and strict lints
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          exit $LASTEXITCODE
      - name: Validate PowerShell orchestration syntax
        shell: pwsh
        run: ./scripts/Check-PowerShell.ps1
      - name: Unit and actual CLI process tests
        env:
          NUMERA_PARENT_SECRET: synthetic-fixture-only
        run: cargo test --workspace --locked
      - name: Build CLI without a display or automation client dependency
        run: cargo build --locked -p core-cli
      - name: Native executable and canonical conformance
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $Binary = if ($IsWindows) { 'target/debug/numera-core.exe' } else { 'target/debug/numera-core' }
          & $Binary --json doctor
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/export-contracts.py --binary $Binary --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/package-contracts.py --binary $Binary
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:NUMERA_CORE_TEST_BINARY = (Resolve-Path $Binary).Path
          python -m unittest discover -s scripts/tests -p test_ncb1_client.py
          exit $LASTEXITCODE
      - name: License inventory and complete dependency notices
        run: python scripts/licenses.py --check
      - name: Stage tested development CLI and matching complete source
        shell: pwsh
        env:
          PACKAGE_TARGET: ${{ matrix.os }}
        run: |
          $Binary = if ($IsWindows) { 'target/debug/numera-core.exe' } else { 'target/debug/numera-core' }
          $Launcher = if ($IsWindows) { 'target/debug/numera-core-gui.exe' } else { 'target/debug/numera-core-gui' }
          python scripts/verify-cli-package.py --binary $Binary --launcher $Launcher --output build/development-cli --target $env:PACKAGE_TARGET
          exit $LASTEXITCODE
      - name: Preserve development CLI; no engine or browser release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: development-cli-${{ matrix.os }}
          path: build/development-cli.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Preserve the versioned NCB-1 development contract
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: numera-core-contracts-v1-${{ matrix.os }}
          path: build/contracts
          retention-days: 7
          if-no-files-found: error
  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Query current vulnerability database for every locked package
        run: python3 scripts/security-audit.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dependency-security
          path: build/security-audit.json
          if-no-files-found: error
  attest-development:
    needs: [native, dependency-security]
    if: >-
      github.repository == 'KiaroSama/Numera-Core-Browser' && github.event.repository.private == false &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: development-cli-*
          path: build/attestation-input
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: numera-core-contracts-v1-ubuntu-24.04
          path: build/attestation-input/contracts
      - name: Prepare the exact tested development artifact subjects
        shell: bash
        run: |
          mkdir -p build/attestation-subjects
          mv build/attestation-input/development-cli-ubuntu-24.04/development-cli.tar.gz build/attestation-subjects/numera-core-cli-linux-x86_64.tar.gz
          mv build/attestation-input/development-cli-windows-2025/development-cli.tar.gz build/attestation-subjects/numera-core-cli-windows-x86_64.tar.gz
          cd build/attestation-input/contracts
          sha256sum --check numera-core-contracts-v1.sha256
          mv numera-core-contracts-v1.zip ../../attestation-subjects/
      - name: Attest the tested development packages and contract
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: build/attestation-subjects/*
      - name: Retain the signed provenance bundle for offline verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: development-artifact-provenance
          path: ${{ steps.attest.outputs.bundle-path }}
          retention-days: 7
          if-no-files-found: error
