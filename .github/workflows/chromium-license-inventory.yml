name: Chromium graph license inventory
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chromium-license-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: >-
      github.repository == 'KiaroSama/Numera-Core-Browser' && github.event.repository.private == false &&
      github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.target }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned native tooling dependency
        run: python -m pip install --disable-pip-version-check -r requirements-engine-build.txt
      - name: Collect license evidence from the pinned native graph
        run: python scripts/chromium_license_inventory.py
      - name: Retain native license review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: chromium-license-evidence-${{ matrix.target }}
          path: build/chromium-license-evidence
          retention-days: 7
          if-no-files-found: error
