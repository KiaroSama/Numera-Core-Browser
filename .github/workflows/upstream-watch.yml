name: Observe upstream releases
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      refresh_observation:
        description: Refresh the observation timestamp to verify draft PR publication
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: upstream-candidate
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'KiaroSama/Numera-Core-Browser'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify candidate branch update semantics
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Read official version feeds
        env:
          REFRESH_OBSERVATION: ${{ inputs.refresh_observation }}
        run: |
          if [ "$REFRESH_OBSERVATION" = true ]; then
            python3 scripts/upstream.py --refresh-observation
          else
            python3 scripts/upstream.py
          fi
      - name: Maintain one review-only candidate PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- upstream/candidates.json; then exit 0; fi
          branch=automation/upstream-candidate
          cp upstream/candidates.json "$RUNNER_TEMP/numera-candidate.json"
          git restore -- upstream/candidates.json
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git checkout -b "$branch" FETCH_HEAD
          else
            git checkout -b "$branch"
          fi
          cp "$RUNNER_TEMP/numera-candidate.json" upstream/candidates.json
          if ! git diff --quiet -- upstream/candidates.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add upstream/candidates.json
            git commit -m 'chore: refresh unreviewed official upstream candidates'
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "$branch"
          fi
          if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" = 0 ]; then
            gh pr create --draft --base main --head "$branch" --title 'chore: review upstream release candidates' --body-file .github/upstream-pr.md
          fi
