name: Observe upstream releases
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      refresh_observation:
        description: Refresh the observation timestamp to verify draft PR publication
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: upstream-candidate
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'KiaroSama/Numera-Core-Browser'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify upstream feeds and candidate publication
        run: cargo test --locked -p core-tooling --bin numera-upstream --bin numera-upstream-publish
      - name: Read official version feeds
        env:
          REFRESH_OBSERVATION: ${{ inputs.refresh_observation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REFRESH_OBSERVATION" = true ]; then
            cargo run --quiet --locked -p core-tooling --bin numera-upstream -- --refresh-observation
          else
            cargo run --quiet --locked -p core-tooling --bin numera-upstream
          fi
      - name: Maintain one review-only candidate PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --quiet --locked -p core-tooling --bin numera-upstream-publish
