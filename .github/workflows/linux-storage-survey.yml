name: Linux hosted storage survey
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  survey:
    if: github.repository == 'KiaroSama/Numera-Core-Browser' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Measure distinct task-relevant volumes without modifying them
        run: cargo run --quiet --locked -p core-tooling --bin numera-linux-storage-survey
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linux-storage-survey
          path: build/linux-storage-survey/report.json
          retention-days: 7
          if-no-files-found: error
