name: Gitleaks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 2'

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Reject debug logging before checkout
        if: runner.debug == '1'
        shell: bash
        run: exit 1
      - name: Check out the exact trusted scanner revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: verified-scanner
          persist-credentials: false
      - name: Build the trusted Rust scanner
        working-directory: verified-scanner
        run: cargo build --locked -p core-tooling --bin numera-gitleaks
      - name: Check out the Git history to scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          path: scan-target
          persist-credentials: false
      - name: Scan Git history with the verified Gitleaks CLI
        working-directory: verified-scanner
        env:
          NUMERA_GITLEAKS_SCAN_ROOT: ${{ github.workspace }}/scan-target
        run: ./target/debug/numera-gitleaks
