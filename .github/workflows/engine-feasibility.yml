name: Engine source-build feasibility
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Select source prerequisites or the unmodified runner browser fixture baseline
        type: choice
        options: [source-prerequisites, runner-browser-baseline]
        default: source-prerequisites
permissions:
  contents: read
concurrency:
  group: engine-feasibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cold-preflight:
    if: github.event.repository.private == false && inputs.probe == 'source-prerequisites'
    name: Chromium / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build the native feasibility and source tools
        run: cargo build --locked -p core-tooling --bins
      - name: Measure cold build prerequisites
        run: ./target/debug/numera-feasibility --output build/feasibility.json
      - name: Preserve measurements even when build is blocked
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: feasibility-${{ matrix.os }}
          path: build/feasibility.json
          if-no-files-found: error
      - name: Enforce owned-engine gate
        run: ./target/debug/numera-feasibility --check build/feasibility.json
  automation-baseline:
    if: >-
      github.repository == 'KiaroSama/Numera-Core-Browser' && github.event.repository.private == false &&
      github.ref == 'refs/heads/main' && inputs.probe == 'runner-browser-baseline'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Install the Linux window inspection tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends x11-utils=7.7+6build2
      - name: Install the locked external browser SDKs
        run: npm --prefix tests/native-automation ci --ignore-scripts --no-fund --no-audit
      - name: Build and pin the Rust adapter for the locked external SDKs
        run: |
          cargo build --locked -p core-sdk-fixture -p core-tooling --bin numera-sdk-fixture --bin numera-prepare-sdk-adapter
          cargo build --locked -p core-sdk-fixture --lib
          cargo run --quiet --locked -p core-tooling --bin numera-prepare-sdk-adapter
      - name: Test Rust loopback and SDK evidence handling
        run: cargo test --locked -p core-tooling --test native_automation
      - name: Build the Rust process ownership fixture
        run: cargo build --locked -p core-process --bin numera-process-fixture
      - name: Run controlled browser fixtures against the runner baseline
        run: cargo run --quiet --locked -p core-tooling --bin numera-automation-baseline -- --sdk-adapter build/native-sdk/adapter.json
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runner-browser-baseline-${{ matrix.os }}
          path: build/automation-baseline
          retention-days: 7
          if-no-files-found: error
