name: Engine source-build feasibility
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Select source prerequisites or the unmodified runner browser fixture baseline
        type: choice
        options: [source-prerequisites, runner-browser-baseline]
        default: source-prerequisites
permissions:
  contents: read
concurrency:
  group: engine-feasibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cold-preflight:
    if: github.event.repository.private == false && inputs.probe == 'source-prerequisites'
    name: Chromium / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Measure cold build prerequisites
        run: python scripts/feasibility.py --output build/feasibility.json
      - name: Preserve measurements even when build is blocked
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: feasibility-${{ matrix.os }}
          path: build/feasibility.json
          if-no-files-found: error
      - name: Enforce owned-engine gate
        run: python -c "import json; r=json.load(open('build/feasibility.json')); raise SystemExit(0 if r['result']=='PASS' else 1)"
  automation-baseline:
    if: >-
      github.repository == 'KiaroSama/Numera-Core-Browser' && github.event.repository.private == false &&
      github.ref == 'refs/heads/main' && inputs.probe == 'runner-browser-baseline'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Install locked browser fixture tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-engine-build.txt
          npm --prefix tests/native-automation ci --ignore-scripts --no-fund --no-audit
        shell: bash
      - name: Run controlled browser fixtures against the runner baseline
        run: python scripts/automation_baseline.py
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runner-browser-baseline-${{ matrix.os }}
          path: build/automation-baseline
          retention-days: 7
          if-no-files-found: error
