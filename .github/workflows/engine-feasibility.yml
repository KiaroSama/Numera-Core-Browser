name: Engine source-build feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-feasibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cold-preflight:
    if: github.event.repository.private == false
    name: Chromium / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Measure cold build prerequisites
        run: python scripts/feasibility.py --output build/feasibility.json
      - name: Preserve measurements even when build is blocked
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: feasibility-${{ matrix.os }}
          path: build/feasibility.json
          if-no-files-found: error
      - name: Enforce owned-engine gate
        run: python -c "import json; r=json.load(open('build/feasibility.json')); raise SystemExit(0 if r['result']=='PASS' else 1)"
