[package]
name = "core-engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
runtime-archive = ["dep:flate2", "dep:tar"]
package-store = [
    "runtime-archive", "dep:async-trait", "dep:futures", "dep:jiff", "dep:semver",
    "dep:tempfile", "dep:tokio", "dep:tough", "dep:windows-sys",
]

[dependencies]
core-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
schemars.workspace = true
url.workspace = true
async-trait = { version = "=0.1.92", optional = true }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"], optional = true }
futures = { version = "=0.3.34", default-features = false, features = ["std"], optional = true }
jiff = { version = "=0.2.46", default-features = false, features = ["std"], optional = true }
semver = { version = "=1.0.28", optional = true }
tar = { version = "=0.4.46", default-features = false, optional = true }
tempfile = { version = "=3.27.0", optional = true }
tokio = { version = "=1.54.1", default-features = false, features = ["rt"], optional = true }
tough = { version = "=0.24.0", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"], optional = true }

[dev-dependencies]
aws-lc-rs = "=1.19.0"
olpc-cjson = "=0.1.4"

[lints]
workspace = true
