[package]
name = "core-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
core-contracts.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["user", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true

[[bin]]
name = "numera-process-fixture"
path = "tests/fixtures/process.rs"
test = false
bench = false
