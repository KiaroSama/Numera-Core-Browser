[package]
name = "core-tooling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
core-contracts.workspace = true
flate2 = "=1.1.11"
jiff = "=0.2.46"
jsonschema = { version = "=0.63.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = "=0.4.46"
tempfile = "=3.27.0"
toml = "=0.9.8"
url.workspace = true
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
rustix = { version = "=1.1.6", features = ["fs", "param", "process", "system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
