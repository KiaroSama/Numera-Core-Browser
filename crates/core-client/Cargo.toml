[package]
name = "core-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
core-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
aws-lc-rs = "=1.19.0"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
olpc-cjson = "=0.1.4"
sha2.workspace = true
tar = { version = "=0.4.46", default-features = false }

[lints]
workspace = true

[[bin]]
name = "numera-client-peer-fixture"
path = "tests/fixtures/peer.rs"
test = false
bench = false
